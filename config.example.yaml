# Example Configuration File for Folder Organizer
# Copy this to config.yaml and customize for your needs

# Directories to organize
directories:
  # Main source directory (usually Downloads)
  source: "~/Downloads"

  # Additional directories to organize (optional)
  # Uncomment and add as needed:
  additional_sources:
    - "~/Desktop"
    # - "~/Documents/Inbox"

  # Where to move folders/projects (relative to source directory)
  projects_folder: "Projects"

# File organization rules
# Add or modify categories and their extensions
file_mappings:
  Audio:
    - .mp3
    - .wav
    - .aac
    - .flac
    - .m4a
    - .wma
    - .ogg
    - .aiff

  Documents:
    - .doc
    - .docx
    - .txt
    - .rtf
    - .odt
    - .pages
    - .md
    - .html
    - .py
    - .vcf
    - .vtt

  Images:
    - .jpg
    - .jpeg
    - .png
    - .gif
    - .bmp
    - .svg
    - .webp
    - .tiff
    - .ico
    - .heic

  Invitations:
    - .ics

  PDFs:
    - .pdf

  Presentations:
    - .ppt
    - .pptx
    - .key
    - .odp

  Screenshots: []  # Handled by filename detection

  Spreadsheets:
    - .xls
    - .xlsx
    - .csv
    - .numbers
    - .ods

  Videos:
    - .mp4
    - .avi
    - .mov
    - .mkv
    - .flv
    - .wmv
    - .webm
    - .m4v
    - .mpeg
    - .mpg

  # Add your custom categories:
  # Archives:
  #   - .zip
  #   - .tar
  #   - .gz
  #   - .rar
  # Code:
  #   - .js
  #   - .py
  #   - .java
  #   - .cpp

# Special filename patterns
# Files matching these patterns go to specified folders regardless of extension
filename_patterns:
  Screenshots:
    - "screenshot"
    - "screen recording"

  # Add your own patterns:
  # Receipts:
  #   - "receipt"
  #   - "invoice"

# Age-based file management (in days)
age_management:
  # Move files older than this to z_Archive subfolder (0 to disable)
  archive_age_days: 30

  # Delete files older than this permanently (0 to disable)
  # WARNING: Deleted files cannot be recovered!
  delete_age_days: 90

  # Keep log entries for this many days (0 to disable rotation)
  log_rotation_days: 90

# Logging configuration
logging:
  # Where to save the log file (relative to script location or absolute path)
  log_file: "organize_log.txt"

  # Print log messages to console
  console_output: true

# Behavior options
behavior:
  # Skip hidden files/folders (starting with .)
  skip_hidden: true

  # Skip .app bundles (macOS applications)
  skip_app_bundles: true

  # Add timestamp to conflicting filenames instead of overwriting
  timestamp_conflicts: true
